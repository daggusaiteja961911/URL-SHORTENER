<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>URL Shortener</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			background : linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			min-height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			padding: 20px;
		}
		
		.container {
			background: white;
			border-radius: 20px;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
			padding: 40px;
			max-width: 600px;
			width: 100%;
		}
		
		h1 {
			color: #333;
			margin-bottom: 10px;
			font-size: 2.5em;
			text-align: center;
		}
		
		.subtitle {
			color: #666;
            margin-bottom: 30px;
            text-align: center;
			font-size: 1.1em;
		}
		
		.form-group {
			margin-bottom: 25px;
		}
		
		label {
			display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
			font-size: 1em;
		}
		
		input[type="url"] {
			width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s;
		}
