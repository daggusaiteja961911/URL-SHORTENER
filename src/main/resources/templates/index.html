<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: #fff;
            padding: 35px;
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="url"] {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 2px solid #ddd;
            font-size: 14px;
        }

        input[type="url"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #5a6fdc;
        }

        .result {
            margin-top: 25px;
            background: #f4f6ff;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            word-break: break-all;
        }

        .result a {
            color: #667eea;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>URL Shortener</h1>
    <p class="subtitle">Paste your long URL below</p>

    <form th:action="@{/shorten}" method="post" th:object="${request}">
        <label>Long URL</label>
        <input type="url" th:field="*{url}" placeholder="https://example.com" required>
        <button type="submit">Shorten URL</button>
    </form>

    <div class="result" th:if="${response != null}">
        <p>Short URL</p>
        <a th:href="${response.shortUrl}"
           th:text="${response.shortUrl}"
           target="_blank"></a>
    </div>
</div>

</body>
</html>
