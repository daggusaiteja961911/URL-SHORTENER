<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener - Result</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: #fff;
            padding: 35px;
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1 {
            margin-bottom: 15px;
        }

        p {
            margin-bottom: 10px;
            word-break: break-all;
        }

        a {
            color: #667eea;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        button {
            margin-top: 25px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background: #5a6fdc;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>Short URL Created!</h1>

    <p><strong>Original URL:</strong></p>
    <p th:text="${response.originalUrl}"></p>

    <p><strong>Short URL:</strong></p>
    <p><a th:href="${response.shortUrl}" th:text="${response.shortUrl}" target="_blank"></a></p>

    <p><strong>Created At:</strong> <span th:text="${response.createdAt}"></span></p>
    <p><strong>Expires At:</strong> <span th:text="${response.expiryAt}"></span></p>

    <form th:action="@{/}" method="get">
        <button type="submit">Create Another Short URL</button>
    </form>
</div>
</body>
</html>
